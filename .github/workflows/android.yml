name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Allow one concurrent build per ref; cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Compile check. The artifact is also built against the real server so a
      # sideloaded CI build actually connects (blank -> the build.gradle.kts
      # emulator placeholder, which fails on a real phone).
      - name: Assemble debug APK
        env:
          API_BASE_URL_VAR: ${{ vars.REVLINE_API_BASE_URL }}
          DEFAULT_API_BASE_URL: 'http://34.151.182.10/'
        run: |
          BASE_URL="${API_BASE_URL_VAR:-$DEFAULT_API_BASE_URL}"
          echo "Building against API base URL: $BASE_URL"
          ./gradlew assembleDebug --no-daemon --stacktrace -PrevlineApiBaseUrl=$BASE_URL

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: revline-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
